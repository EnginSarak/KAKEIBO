<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/kakeibo-icon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/kakeibo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f9fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05060b" />
    <meta name="description" content="Kakeibo. Persönliches Budget-Management" />
    <title>Kakeibo</title>
    <script>
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("kakeibo_settings") || "{}");
          var theme = s.theme || "system";
          var dark = theme === "dark" ||
            (theme === "system" && window.matchMedia &&
             window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          if (theme !== "system") {
            var olds = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
            var m = document.createElement("meta");
            m.setAttribute("name", "theme-color");
            m.setAttribute("content", dark ? "#05060b" : "#f7f9fb");
            document.head.appendChild(m);
          }
        } catch (e) {}
      })();
    </script>
    <script>
      window.addEventListener("error", function(e) {
        if (e.error instanceof DOMException && e.error.name === "DataCloneError" && e.message && e.message.includes("PerformanceServerTiming")) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <noscript>JavaScript muss aktiviert sein, um diese App zu nutzen.</noscript>
    <div id="root"></div>
  </body>
</html>
